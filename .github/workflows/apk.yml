# Membangun APK Batang Garing Editor dan menerbitkannya di halaman Releases.
name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Pastikan index.html terbaru
        run: sh scripts/build-web.sh

      - name: Build APK
        working-directory: android
        env:
          VERSION_CODE: ${{ github.run_number }}
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: Siapkan file
        run: cp android/app/build/outputs/apk/release/app-release.apk BatangGaringEditor.apk

      - uses: actions/upload-artifact@v4
        with:
          name: BatangGaringEditor-apk
          path: BatangGaringEditor.apk

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-${{ github.run_number }}
          name: Batang Garing Editor ${{ github.run_number }}
          body: |
            Unduh **BatangGaringEditor.apk** di bawah ini dari HP Android, lalu buka file-nya untuk memasang
            (izinkan "Instal aplikasi tidak dikenal" bila diminta). Versi baru bisa dipasang di atas versi lama.
          files: BatangGaringEditor.apk
          make_latest: true
