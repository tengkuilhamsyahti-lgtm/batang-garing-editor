// Batang Garing Editor untuk Android: editor web (index.html) dibawa di dalam APK dan
// ditampilkan di WebView. Simpan ke Galeri dan bagikan lewat jembatan native (NativeBridge).
plugins {
    id 'com.android.application'
}

android {
    namespace 'id.batanggaring.editor'
    compileSdk 34

    defaultConfig {
        applicationId 'id.batanggaring.editor'
        minSdk 24
        targetSdk 34
        versionCode((System.getenv('VERSION_CODE') ?: '1') as int)
        versionName '1.' + (System.getenv('VERSION_CODE') ?: '0')
    }

    signingConfigs {
        release {
            // Kunci tetap supaya versi baru bisa dipasang di atas versi lama.
            storeFile file(System.getenv('KS_PATH') ?: 'editor.keystore')
            storePassword System.getenv('KS_PASS') ?: 'batanggaring'
            keyAlias 'editor'
            keyPassword System.getenv('KS_PASS') ?: 'batanggaring'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
        debug {
            signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        checkReleaseBuilds false
        abortOnError false
    }

    sourceSets {
        main.assets.srcDirs += "$buildDir/generated/web"
    }
}

// salin editor web dari akar repo ke dalam APK (assets/www) supaya jalan tanpa internet
def copyWeb = tasks.register('copyWeb', Copy) {
    from(rootProject.file('..')) {
        include 'index.html', 'icon.svg'
    }
    into "$buildDir/generated/web/www"
}
tasks.named('preBuild') { dependsOn copyWeb }
